
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone Style Dialer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Locate Android project
        run: |
          pwd
          ls -la
          find . -maxdepth 4 \( -name gradlew -o -name settings.gradle.kts -o -name settings.gradle \) -print

      - name: Build Android APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          elif [ -f ./app/gradlew ]; then
            cd app
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            echo "ERROR: Gradle wrapper gradlew was not found."
            echo "The project needs a Gradle wrapper before it can build."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iphone-style-dialer-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
