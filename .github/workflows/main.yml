name: Build iPhone Style Android Dialer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Android Build Files & Wrapper
        run: |
          # 1. Create .env if missing
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Restore or create debug.keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Auto-generate gradlew and wrapper jar if missing in repository
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper missing from repository. Auto-generating wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x ./gradlew

      - name: Validate Gradle
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK was created
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -type f
          test -n "$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-style-dialer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
