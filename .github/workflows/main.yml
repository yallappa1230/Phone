
name: Build iPhone Style Phone Dialer APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Phone Dialer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Check Android project files
        shell: bash
        run: |
          echo "========== PROJECT FILES =========="
          ls -la
          find app -maxdepth 6 -type f -print 2>/dev/null || true

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build Phone Dialer APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleDebug --stacktrace --info 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}

          echo "========== IMPORTANT BUILD ERRORS =========="
          grep -n -B 3 -A 8 -E \
            "What went wrong:|Could not resolve|Plugin .* was not found|e: file:|Compilation error|Android resource linking failed|Namespace not specified|SDK location not found|Minimum supported Gradle|Could not determine" \
            build.log || true

          exit "$RESULT"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK created: $APK"

      - name: Upload Phone Dialer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Style-Phone-Dialer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
