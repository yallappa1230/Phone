
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone Style Dialer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Check Android SDK
        run: |
          adb version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Check project files
        run: |
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -type f
          test -n "$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iphone-style-dialer-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
